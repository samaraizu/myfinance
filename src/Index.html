<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --sub: #6e6e73;
      --accent: #1f6f5c; --warn-bg: #fff4e5; --warn: #9a5b00; --err: #b3261e; --line: #e6e4df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212; --card: #1e1e1e; --ink: #f2f2f2; --sub: #a0a0a5;
        --accent: #5fc7a8; --warn-bg: #3a2c12; --warn: #f2c26b; --err: #ff8a80; --line: #2e2e2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 15px; line-height: 1.5;
    }
    .month { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .month small { color: var(--sub); display: block; }
    .month strong { font-size: 32px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .shoot {
      display: flex; align-items: center; justify-content: center; width: 100%;
      height: 120px; border: 2px dashed var(--line); border-radius: 16px; background: var(--card);
      color: var(--accent); font-size: 17px; font-weight: 600; cursor: pointer; overflow: hidden;
    }
    .shoot img { max-width: 100%; max-height: 100%; object-fit: contain; }
    input[type=file] { display: none; }
    button.send {
      width: 100%; margin-top: 12px; padding: 16px; border: 0; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
    }
    button.send:disabled { opacity: .4; }
    .status { margin: 12px 0; color: var(--sub); min-height: 1.5em; }
    .status.err { color: var(--err); }
    .alert { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px; margin: 12px 0; }
    .result { background: var(--card); border-radius: 16px; padding: 16px; display: none; }
    .result h2 { font-size: 17px; margin: 0; }
    .result .meta { color: var(--sub); font-size: 13px; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.amt { text-align: right; white-space: nowrap; padding-left: 8px; }
    td .cat { color: var(--sub); font-size: 12px; }
    td .disc { color: var(--warn); font-size: 12px; }
    tfoot td { font-weight: 700; border-bottom: 0; }
    a { color: var(--accent); }
    .footer { margin-top: 16px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="month">
    <small id="monthLabel">今月の支出</small>
    <strong id="monthTotal">—</strong>
  </div>

  <label class="shoot" id="shoot">
    <span id="shootLabel">📷 レシートを撮影</span>
    <input type="file" id="file" accept="image/*" capture="environment">
  </label>
  <button class="send" id="send" disabled>送信して読み取る</button>

  <div class="status" id="status"></div>
  <div id="alert"></div>
  <div class="result" id="result"></div>
  <div class="footer"><a id="sheetLink" href="#" target="_blank" rel="noopener" hidden>スプレッドシートを開く</a></div>

  <script>
    const MAX_EDGE = 1600;
    const yen = (n) => '¥' + Number(n || 0).toLocaleString('ja-JP');
    const $ = (id) => document.getElementById(id);
    let payload = null;

    $('monthLabel').textContent = `${new Date().getMonth() + 1}月の支出`;

    function setMonthTotal(n) { $('monthTotal').textContent = yen(n); }
    function setStatus(text, isError) {
      $('status').textContent = text;
      $('status').className = 'status' + (isError ? ' err' : '');
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    google.script.run
      .withSuccessHandler((s) => {
        setMonthTotal(s.monthTotal);
        $('sheetLink').href = s.spreadsheetUrl;
        $('sheetLink').hidden = false;
      })
      .withFailureHandler((e) => setStatus(e.message, true))
      .getSummary();

    // 送信量を抑えるため長辺 MAX_EDGE px の JPEG に縮小。読めない形式はそのまま送る
    function prepare(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          URL.revokeObjectURL(url);
          resolve({ preview: dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = () => {
          const reader = new FileReader();
          reader.onload = () => resolve({ preview: null, base64: String(reader.result).split(',')[1], mimeType: file.type });
          reader.readAsDataURL(file);
        };
        img.src = url;
      });
    }

    $('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus('画像を準備中…');
      payload = await prepare(file);
      $('shootLabel').innerHTML = payload.preview ? `<img src="${payload.preview}" alt="">` : esc(file.name);
      $('send').disabled = false;
      setStatus('');
    });

    $('send').addEventListener('click', () => {
      if (!payload) return;
      $('send').disabled = true;
      $('alert').innerHTML = '';
      $('result').style.display = 'none';
      setStatus('読み取り中…（10〜30秒）');
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler((err) => { setStatus(err.message, true); $('send').disabled = false; })
        .uploadReceipt(payload.base64, payload.mimeType);
    });

    function render(res) {
      setMonthTotal(res.monthTotal);
      payload = null;
      $('file').value = '';
      $('shootLabel').textContent = '📷 次のレシートを撮影';

      if (res.status === 'queued') {
        setStatus('保存しました。自動処理中のため、数分後に記録されます。');
        return;
      }
      if (res.status === 'error') {
        setStatus(`読み取りに失敗しました: ${res.message}`, true);
        return;
      }
      setStatus('記録しました');
      const r = res.receipt;
      const alerts = [];
      if (!r.ok) alerts.push(`明細合計 ${yen(r.itemsSum)} とレシート合計 ${yen(r.total)} が合いません（差額 ${yen(r.diff)}）。スプレッドシートで確認してください。`);
      if (r.dateGuessed) alerts.push('購入日が読めなかったため、今日の日付で記録しました。');
      $('alert').innerHTML = alerts.map((a) => `<div class="alert">${esc(a)}</div>`).join('');

      const rows = r.items.map((it) => `
        <tr>
          <td>${esc(it.name)}${it.quantity > 1 ? ` ×${it.quantity}` : ''}<br>
            <span class="cat">${esc(it.category)}</span>
            ${it.discount ? `<span class="disc">　値引 -${yen(it.discount)}</span>` : ''}</td>
          <td class="amt">${yen(it.amount)}</td>
        </tr>`).join('');
      $('result').innerHTML = `
        <h2>${esc(r.store)}</h2>
        <div class="meta">${esc(r.date)}　${r.items.length}品目${r.tax != null ? `　税 ${yen(r.tax)}` : ''}</div>
        <table><tbody>${rows}</tbody>
          <tfoot><tr><td>合計</td><td class="amt">${yen(r.total)}</td></tr></tfoot>
        </table>`;
      $('result').style.display = 'block';
    }
  </script>
</body>
</html>
